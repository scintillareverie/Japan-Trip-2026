<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japan Trip 2026 Preview</title>
  <style>
   @import url("https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=Prata&display=swap");

    :root {
      --bg: #faf8f3;
      --paper: #ffffff;
      --ink: #1a1208;
      --muted: #8a7566;
      --muted-2: #6b5748;
      --line: #ede8e0;
      --gold: #ffd080;
      --header-1: #1a0800;
      --header-2: #3b1306;
      --header-3: #6a1f0e;
      --header-4: #8c3514;
      --shadow: 0 10px 30px rgba(60, 20, 5, 0.12);
      --radius-lg: 16px;
      --radius-md: 14px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    .app-shell {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
    }

    .fade-in {
      animation: fadeIn 0.22s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pressable {
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .pressable:active {
      transform: scale(0.985);
      opacity: 0.85;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #d4c4b0;
      border-radius: 999px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 24px 22px 14px; 
      color: #fff;
      background: linear-gradient(155deg, var(--header-1) 0%, var(--header-2) 45%, var(--header-3) 80%, var(--header-4) 100%);
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: 0 12px 30px rgba(60, 20, 5, 0.16);
    }

    .eyebrow {
      font-size: 11.5px; 
      letter-spacing: 3.2px;
      text-transform: uppercase;
      color: rgba(255, 200, 100, 0.6);
      margin-bottom: 10px;
    }

    .hero-title {
      font-family: "Prata", serif;
      font-size: 34px; 
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.5px;
      margin: 0 0 8px; 
    }

    .hero-subtitle {
      font-family: "DM Sans", sans-serif; /* Switched to clean sans-serif for premium contrast */
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px; /* Tracked out wide for a high-end designer look */
      color: rgba(255, 215, 155, 0.95);
      margin-bottom: 16px;
    }

    .hero-meta {
      font-size: 13.5px; 
      color: rgba(255, 255, 255, 0.58);
      letter-spacing: 0.4px;
    }

    .pill-row,
    .tab-row,
    .segment-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .pill-row::-webkit-scrollbar,
    .tab-row::-webkit-scrollbar,
    .segment-row::-webkit-scrollbar {
      display: none;
    }

    .pill-row {
      margin-top: 14px;
    }

    .city-pill,
    .tab-pill,
    .segment-pill,
    .day-pill {
      white-space: nowrap;
      border-radius: 999px;
      border: 1px solid transparent;
      background: #fff;
    }

    .city-pill,
    .tab-pill {
      flex-shrink: 0;
    }

    .city-pill {
      padding: 5px 10px; 
      font-size: 10.5px; 
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.72);
      border-color: rgba(255, 255, 255, 0.18);
      flex-shrink: 0;
    }

    .city-pill.active {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .tabs-wrap {
      margin: 10px 14px 0; 
    }

    .tab-pill {
      padding: 7px 12px; 
      border: none;
      font-size: 11.5px; 
      font-weight: 600;
      background: #ede8e0;
      color: #6b5748;
    }

    .tab-pill.active {
      background: #1a0800;
      color: #ffd080;
    }

    .content {
      padding: 12px 14px 40px;
    }

    .section-block {
      margin-bottom: 14px;
    }

    .section-title {
      margin-bottom: 12px;
    }

    .section-title .small {
      font-size: 11.5px; 
      letter-spacing: 2.4px;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .section-title .main {
      font-family: "Cormorant Garamond", serif;
      font-size: 30px; 
      line-height: 1.05;
      color: #2d241b;
    }

    .section-title .sub {
      font-size: 13.5px; 
      color: #7a6a5c;
      margin-top: 6px;
      line-height: 1.5;
    }

    .card {
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .compact-card {
      padding: 14px 15px;
      margin-bottom: 9px;
      border-radius: var(--radius-md);
    }

    .flight-card {
      padding: 14px 15px;
      border-radius: var(--radius-md);
      color: #fff;
      margin-bottom: 10px;
    }

    .flight-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .flight-type {
      font-size: 11.5px; 
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    .flight-route {
      font-size: 18px;
      font-weight: 800;
    }

    .flight-detail {
      font-size: 13px; 
      color: rgba(255, 255, 255, 0.86);
      line-height: 1.75;
      white-space: pre-line;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      padding: 10px 12px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--line);
      margin-bottom: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .legend-label {
      font-size: 13px; 
      color: #6b5748;
    }

    .day-card {
      margin-bottom: 10px;
      overflow: hidden;
    }

    .day-summary {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 13px;
    }

    .day-index {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    .day-summary-main {
      flex: 1;
      min-width: 0;
    }

    .day-line {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .day-date {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .day-dow {

      color: #b0a090;
    }

    .day-city {
      margin-left: auto;
      font-size: 11.5px; 
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid currentColor;
    }

    .day-theme {
      font-size: 14px;
      color: #6b5c4e;
      margin-top: 3px;
      line-height: 1.4;
    }

    .chevron {
      color: #b0a090;
      font-size: 12px;
      transition: transform 0.2s ease;
    }

    .chevron.open {
      transform: rotate(180deg);
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px; 
      padding: 14px 13px 12px; 
    }

    .chip {
      padding: 6px 12px; 
      border-radius: 999px;
      font-size: 12px; 
      font-weight: 600;
      border: 1px solid currentColor;
    }

    .hotel-inline {
      margin: 0 13px 10px;
      padding: 10px 12px;
      border-radius: 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid transparent;
    }

    .hotel-icon {
      font-size: 20px;
      line-height: 1;
    }

    .hotel-name {
      font-size: 15px;
      font-weight: 700;
    }

    .hotel-meta {
      font-size: 12.5px;
      color: #7a6a5c;
      margin-top: 2px;
      line-height: 1.45;
    }

    .timeline {
      padding: 2px 13px 14px;
    }

    .timeline-item {
      display: flex;
      gap: 9px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f2ede5;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .timeline-time {
      width: 44px; 
      flex-shrink: 0;
      text-align: right;
      padding-top: 2px;
      font-size: 12.5px; 
      color: #a09080;
      font-weight: 600;
    }

    .timeline-bar {
      width: 3px;
      min-height: 36px;
      flex-shrink: 0;
      border-radius: 2px;
      background: #ccc;
    }

    .timeline-main {
      flex: 1;
      min-width: 0;
    }

    .timeline-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 2px;
      line-height: 1.35;
    }

    .timeline-sub {
      font-size: 13px;
      color: #8a7566;
      line-height: 1.55;
    }

    .city-overview-card {
      overflow: hidden;
      margin-bottom: 12px;
    }

    .city-overview-head {
      padding: 14px 15px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }

    .city-overview-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .city-overview-title .emoji {
      font-size: 26px;
    }

    .city-overview-title .name {
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      font-weight: 600;
    }

    .city-overview-stay {

      margin-top: 1px;
    }

    .city-overview-body {

    .bullet-line {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 7px;
    }

    .bullet-line:last-child {
      margin-bottom: 0;
    }

    .bullet-dot {
      width: 5px;
      height: 5px;
      margin-top: 5px;
      border-radius: 999px;

    }

    .bullet-text {
      font-size: 13px;
      color: #4a3c30;
      line-height: 1.5;
    }

    .day-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .day-pill {
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      background: #fff;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 12px;
    }

    .filter-grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-bottom: 14px;
    }

    .grid-pill {
      padding: 9px 8px;
      border-radius: 12px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      color: #6b5748;
      background: #ede8e0;
    }

    .segment-pill {
      padding: 8px;
      border-width: 1.5px;
      border-style: solid;
      font-size: 12px;
      font-weight: 600;
      background: #fff;
      color: #8a7566;
      flex: 1;
    }

    .place-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .place-icon {
      font-size: 20px;
      line-height: 1;
    }

    .place-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .place-meta {
      font-size: 12px;
      color: #8a7566;

    }

    .place-line {
      font-size: 13px;
      color: #6b5748;
      margin-bottom: 5px;

    }

    .place-note {

      flex-wrap: wrap;
      gap: 6px;

    }

    .tag {
      font-size: 10.5px;

      border-radius: 999px;

    .accent-label {

      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .action-wrap {

      background: #fffbeb;
      border: 1.5px solid #fde68a;
      border-radius: 14px;

    .action-head {
      display: flex;
      align-items: center;

    }

      gap: 12px;

      padding: 13px 15px;

      font-weight: 800;

      justify-content: space-between;
      align-items: center;
      padding: 14px 15px;

      font-size: 13px;

      }

      .filter-grid.two {
        grid-template-columns: 1fr 1fr;

    /* === BOTTOM NAVIGATION BAR === */
:root {
  --nav-bg: #ffffff;
  --nav-text: #9CA3AF; /* Gray for inactive */
  --nav-active: #2563EB; /* Blue for active */
}

/* Ensure the main content doesn't hide behind the nav bar */
body {
  padding-bottom: 90px; /* Space for the bottom nav */
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background-color: var(--nav-bg);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 12px 10px;
  /* env() ensures it sits above the iPhone home bar */
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  z-index: 1000;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--nav-text);
  cursor: pointer;
  width: 70px;
  /* Smooth transition for the elegant switch */
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.nav-icon {
  font-size: 24px;
  margin-bottom: 4px;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.nav-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* Active State Styling */
.nav-item.active {
  color: var(--nav-active);
}

.nav-item.active .nav-icon {
  transform: translateY(-4px) scale(1.15); /* Slight upward bounce */
}

/* Fade in animation for the content when switching tabs */
.fade-in {
  animation: fadeIn 0.4s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

<body>
  <div id="app" class="app-shell"></div>

  <script>
    const STORAGE_KEY = "japan-trip-2026-checklist";

    function loadDoneItems() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        return [];
      }
    }

    function saveDoneItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function getCityCfg(city) {
      return CITY_CFG[city] || CITY_CFG.Transit;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function hotelForCity(city) {
      return HOTELS.find((hotel) => hotel.city === city);
    }

    const CITY_CFG = {
      Osaka: { color: "#C44B0E", bg: "#FFF4EE", border: "#FDBA74", deep: "#7C2D12", emoji: "🏯" },
      Kyoto: { color: "#155E3E", bg: "#F0FDF4", border: "#6EE7B7", deep: "#14532D", emoji: "⛩️" },
      Tokyo: { color: "#1E3A8A", bg: "#EFF6FF", border: "#93C5FD", deep: "#172554", emoji: "🗼" },
      Transit: { color: "#7C3AED", bg: "#F5F3FF", border: "#C4B5FD", deep: "#5B21B6", emoji: "🚅" }

                            ${action.urgent ? `<span class="urgent">URGENT</span>` : ""}
                          </div>
                          <div class="action-card-desc">${escapeHtml(action.desc)}</div>
                        </div>
                      `
                    ).join("")}
                  </div>
                `
                : ""
            }
          </div>

          ${renderSectionTitle({
            eyebrow: "Checklist",
            title: `Pre-trip tasks • ${doneCount}/${CHECKLIST.length} done`,
            subtitle: "Categorized lists to keep your planning organized.",
            color: "#7C2D12"
          })}

          ${categories.map(category => {
            const items = CHECKLIST.filter(item => item.category === category);
            return `
              <div style="font-size: 11px; font-weight: 800; color: #8A7566; text-transform: uppercase; letter-spacing: 1.5px; margin: 20px 0 10px 4px;">
                ${escapeHtml(category)}
              </div>
              ${items.map((item) => {
                const checked = isDone(item.name);
                const inputId = `todo-${item.name.replace(/[^a-z0-9]+/gi, "-").toLowerCase()}`;
                return `
                  <label for="${inputId}" class="check-row pressable ${checked ? "done" : ""}">
                    <input
                      id="${inputId}"
                      type="checkbox"
                      ${checked ? "checked" : ""}
                      onchange="appActions.toggleDone('${escapeHtml(item.name).replace(/&#39;/g, "\\'")}')"
                    />
                    <div>
                      <div class="check-title">${escapeHtml(item.name)}</div>
                      <div class="check-sub">${escapeHtml(item.sub)}</div>
                    </div>
                  </label>
                `;
              }).join("")}
            `;
          }).join("")}

        </section>
      `;
    }

    function renderTipsTab() {
      return `
        <section class="section-block fade-in">
          ${renderSectionTitle({
            eyebrow: "Practical",
            title: "Japan tips",
            subtitle: "Your original guidance stays here, with the shared data sections living above it.",
            color: "#155E3E"
          })}

          ${TIPS.map(
            (tip) => `
              <div class="card tip-card">
                <div class="tip-title">${escapeHtml(tip.icon)} ${escapeHtml(tip.title)}</div>
                <div class="tip-body">${escapeHtml(tip.body)}</div>
              </div>
            `
          ).join("")}

          <div class="footer-banner">
            <div class="line-1">Osaka • Kyoto • Tokyo</div>
            <div class="line-2">25 Nov – 7 Dec 2026 • 13 Days • 12 Nights</div>
          </div>
        </section>
      `;
    }

    function renderActiveTab() {
      switch (STATE.tab) {
        case "schedule": return renderScheduleTab();
        case "cities": return renderCitiesTab();
        case "shopping": return renderShoppingTab();
        case "phrasebook": return renderPhrasebookTab();
        case "prep": return renderPrepTab(); 
        case "tips": return renderTipsTab();
        case "expense": return renderExpenseTab(); 
        case "transit": return renderTransitTab();  
        default: return renderScheduleTab();
      }
    }

    function renderBottomNav() {
      return `
        <nav class="bottom-nav">
          <div class="nav-item ${STATE.tab === 'schedule' ? 'active' : ''}" onclick="appActions.setTab('schedule')">
            <div class="nav-icon">📅</div>
            <div class="nav-label">Itinerary</div>
          </div>
          
          <div class="nav-item ${STATE.tab === 'shopping' ? 'active' : ''}" onclick="appActions.setTab('shopping')">
            <div class="nav-icon">🛍️</div>
            <div class="nav-label">Shopping</div>
          </div>
          
          <div class="nav-item ${STATE.tab === 'phrasebook' ? 'active' : ''}" onclick="appActions.setTab('phrasebook')">
            <div class="nav-icon">💬</div>
            <div class="nav-label">Phrases</div>
          </div>
          
          <div class="nav-item ${STATE.tab === 'expense' ? 'active' : ''}" onclick="appActions.setTab('expense')">
            <div class="nav-icon">💴</div>
            <div class="nav-label">Expenses</div>
          </div>
        </nav>
      `;
    }

    function renderApp() {
      document.getElementById("app").innerHTML = `
        ${renderHeader()}
        ${renderTabBar()}
        <main class="content">
          ${renderActiveTab()}
        </main>
        ${renderBottomNav()}
      `;
    }

    renderApp();
  </script>
</body>
</html>
